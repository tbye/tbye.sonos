# managed-by: tbye.sonos
# Discover AirPlay/RAOP receivers (Sonos, HomePod, Apple TV) and
# expose each one as a PipeWire sink so the session can use it as
# a normal audio output.
context.modules = [
    {
        name = libpipewire-module-raop-discover
        args = {
            # ~1.5s is typical for Wi-Fi AirPlay; too low and Sonos
            # drops the session, too high and video falls behind.
            raop.latency.ms = 1500
        }
    }
]
